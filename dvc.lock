schema: '2.0'
stages:
  process_data:
    cmd: python ./src/data/process_data.py  ./data/raw/movies_metadata.csv
    deps:
    - path: ./data/raw/movies_metadata.csv
      hash: md5
      md5: 42bf3ef8c208a01a4776955875978b1e
      size: 34445126
    - path: ./src/data/process_data.py
      hash: md5
      md5: 3d2fc2af3f09cc4c5da23cbea2ce7ff9
      size: 1773
    params:
      params.yaml:
        data.processed_data_file: movies_metadata_processed.csv
        data.processed_data_path: data/processed
        data.raw_data_file: movies_metadata.csv
        data.raw_data_path: data/raw
  build_features:
    cmd: python ./src/features/build_features.py 
      ./data/processed/movies_metadata_processed.csv
    deps:
    - path: ./data/processed/movies_metadata_processed.csv
      hash: md5
      md5: 235c18521480691cc512400659c0eb25
      size: 19905546
    - path: ./src/features/build_features.py
      hash: md5
      md5: 574935385c1e2f232ab5ccccd95febd6
      size: 2593
    params:
      params.yaml:
        data.features_data_file: features_data.csv
        data.processed_data_file: movies_metadata_processed.csv
        data.processed_data_path: data/processed
  train_model:
    cmd: python ./src/models/train_model.py ./data/processed/features_data.csv
    deps:
    - path: ./data/processed/features_data.csv
      hash: md5
      md5: e4239b2d210cd4a2544f4ea2e37f2cfa
      size: 12529104
    - path: ./src/models/train_model.py
      hash: md5
      md5: 8bfc38577420d771dac89c7692026d05
      size: 2249
    params:
      params.yaml:
        data.features_data_file: features_data.csv
        data.processed_data_path: data/processed
        parameters.model.n_features: 50000
        parameters.model.n_grams:
        - 1
        - 2
  predict:
    cmd: python ./src/models/predict_model.py ./data/processed/features_data.csv
    deps:
    - path: ./data/processed/features_data.csv
      hash: md5
      md5: e4239b2d210cd4a2544f4ea2e37f2cfa
      size: 12529104
    - path: ./src/models/predict_model.py
      hash: md5
      md5: 753523ae79cdae9e35f9434f01d6a50b
      size: 1489
    params:
      params.yaml:
        data.features_data_file: features_data.csv
        data.processed_data_path: data/processed
        predict.movie_title: The Godfather
        predict.n_recommendations: 10
