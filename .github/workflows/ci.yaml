name: CI

on: push

jobs:
  ci-test:
    runs-on: ubuntu-latest
    env:
      DOCKER_USERNAME: ${{ secrets.DOCKER_USERNAME }}
      DOCKER_KEY: ${{ secrets.DOCKER_KEY }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name : Configure DVC Google Drive Service Account
        env :
          GDRIVE_CREDENTIALS_DATA : ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run : |
          echo "Setting up Google Drive Service Account..."
          echo "$GDRIVE_CREDENTIALS_DATA" > gdrive-credentials.json
          dvc remote modify myremote gdrive_use_service_account true
          dvc remote modify myremote gdrive_service_account_json_file_path gdrive-credentials.json
          echo "✓ Service Account credentials configured"
          
          
      - name: Pull data from DVC Google Drive
        run: |
          echo "Pulling data from Google Drive using Service Account..."
          dvc pull -v
          echo "Data successfully pulled from Google Drive"

      - name: Run pipeline
        env:
          DAGSHUB_MOVIE: ${{ secrets.DAGSHUB_MOVIE }}
        run: |
          dvc repro

      - name: Docker login
        if: success() && env.DOCKER_USERNAME != '' && env.DOCKER_KEY != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKER_USERNAME }}
          password: ${{ env.DOCKER_KEY }}

      - name: Build Docker image
        if: success() && env.DOCKER_USERNAME != ''
        run: |
          docker build -t ${{ env.DOCKER_USERNAME }}/movie-recommender-system:latest .

      - name: Push Docker image to DockerHub
        if: success() && env.DOCKER_USERNAME != '' && env.DOCKER_KEY != ''
        run: |
          docker push ${{ env.DOCKER_USERNAME }}/movie-recommender-system:latest

      - name: Cleanup credentials file
        if: always()
        run: rm -f gdrive-credentials.json

      