name: CI

on: push
jobs:
  ci-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.11.9'
      - name : Cache pip dependencies
        uses : actions/cache@v3
        with :
          path : ~/.cache/pip
          key : ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys : |
            ${{ runner.os }}-pip-


      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name : Configure DVC Google Drive Service Account
        env :
          GDRIVE_CREDENTIALS_DATA : ${{ secrets.GDRIVE_CREDENTIALS_DATA }}
        run : |
          echo "Setting up Google Drive Service Account..."
          echo "$GDRIVE_CREDENTIALS_DATA" > gdrive-credentials.json
          dvc remote modify myremote gdrive_use_service_account true
          dvc remote modify myremote gdrive_service_account_json_file_path gdrive-credentials.json
          echo "✓ Service Account credentials configured"
         
          
      - name : Pull data from DVC Google Drive
        run : |
          echo "Pulling data from Google Drive using Service Account..."
          dvc pull -v
          echo "✓ Data successfully pulled from Google Drive"
          
      - name : Run pipeline
        env :
          IOT_DAGSHUB_KEY : ${{ secrets.DAGSHUB_MOVIE }}
        run : |
          dvc repro
      - name : Docker login
        if : success()
        uses : docker/login-action@v2
        with :
          username : ${{ secrets.DOCKER_USERNAME }}
          password : ${{ secrets.DOCKER_KEY }}
      - name : Build Docker image
        if : success()
        run : |
          docker build -t ${{secrets.DOCKER_USERNAME}}/movie-recommender-system:latest .

      - name : Tag Docker image
        if : success()
        run : |
          docker tag ${{secrets.DOCKER_USERNAME}}/movie-recommender-system:latest ${{secrets.DOCKER_USERNAME}}/movie-recommender-system:latest

      - name : Push Docker image to DockerHub
        if : success()
        run : |
          docker push ${{secrets.DOCKER_USERNAME}}/movie-recommender-system:latest

      